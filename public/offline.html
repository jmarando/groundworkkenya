<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141C19" />
    <title>Offline · Groundwork</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        box-sizing: border-box;
        background: #141c19;
        color: #f5f5f0;
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        width: min(420px, 100%);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      svg {
        width: 40px;
        height: 40px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
      }
      p {
        margin: 0;
        color: #c9cbc4;
      }
      nav {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 6px;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 10px;
        font-weight: 600;
        text-decoration: none;
        color: #fff;
        background: #d9481c;
      }
      a + a {
        background: transparent;
        border: 1.5px solid #5b625e;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path d="M86 28V14H14V86H86V52H62" fill="none" stroke="#F5F5F0" stroke-width="13" />
        <rect x="40" y="45.5" width="13" height="13" fill="#D9481C" />
      </svg>
      <h1>You're offline.</h1>
      <p>The field app and the pages you've opened before work without signal.</p>
      <nav>
        <a href="/field">Field app</a>
        <a href="/home">Home</a>
      </nav>
    </main>
  </body>
</html>
